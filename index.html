<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login If You Dare! 👻</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <h1 class="scary-title">LOGIN IF YOU DARE 🎃</h1>
    <p class="subtitle">Catch the boxes if you can...</p>

    <form onsubmit="return false;">
      <div class="field-wrapper float-1">
        <input type="email" placeholder="Email (Wild Flying)" required />
      </div>

      <div class="field-wrapper float-2">
        <input type="password" placeholder="Password (Spinning Away)" required />
      </div>

      <div class="field-wrapper float-3">
        <button type="button" class="login-btn">
          LOGIN NOW 🚀
        </button>
      </div>
    </form>
  </div>

</body>
</html>
